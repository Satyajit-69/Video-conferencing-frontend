name: Frontend Deploy (Self Hosted)

on:
  push:
    branches: ["main"]

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Build frontend (memory-safe)
        run: |
          export NODE_OPTIONS="--max_old_space_size=2048"
          npm run build

      - name: Restart frontend server
        run: |
          pm2 restart frontend || pm2 start "npx serve -s dist -l 3000" --name frontend
